<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De Primera Gama</title>
<meta name="description" content="Catálogo de productos de De Primera Gama">
<style>
:root{--green:#0d5c3a;--light:#f5f7f5;--dark:#17352a;--accent:#25d366}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--light);color:#222}.top{background:var(--green);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:25px}.top p{margin:4px 0 0;font-size:14px}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 10px #00000012}.hero h2{margin:0 0 8px;color:var(--dark)}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:10px 0}.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}.cats button{border:0;border-radius:20px;padding:10px 14px;background:#e4eee9;white-space:nowrap}.cats button.active{background:var(--green);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #00000012;display:flex;flex-direction:column}.photo{height:150px;background:#eef1ef;display:flex;align-items:center;justify-content:center;color:#777;font-size:44px}.info{padding:13px}.info h3{margin:0 0 6px;font-size:17px}.desc{font-size:13px;color:#666;min-height:32px}.price{font-size:20px;font-weight:700;color:var(--green);margin:10px 0}.add{width:100%;padding:11px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:700}.cart{position:sticky;bottom:10px;margin:18px 0 0;background:#17352a;color:#fff;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}.wa{background:var(--accent);color:#063b1b;border:0;padding:12px 16px;border-radius:10px;font-weight:700}.empty{text-align:center;padding:35px;color:#777}.footer{text-align:center;padding:25px;color:#777;font-size:13px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}.photo{height:120px}.info h3{font-size:15px}.price{font-size:18px}.cart{font-size:13px}}
</style>
</head>
<body>
<header class="top"><h1>De Primera Gama</h1><p>Productos de almacén · Pedidos por WhatsApp</p></header>
<main class="wrap">
<section class="hero"><h2>Catálogo</h2><p>Elegí tus productos, agregalos al carrito y enviá tu pedido por WhatsApp.</p><input id="search" class="search" placeholder="Buscar productos..." autocomplete="off"><div id="cats" class="cats"></div></section>
<section id="products" class="grid"></section>
<div id="cart" class="cart" hidden><div><b id="count">0</b> productos · Total: <b id="total">$0</b></div><button class="wa" onclick="sendWhatsApp()">Enviar pedido por WhatsApp</button></div>
<footer class="footer">De Primera Gama · Instagram: @deprimera.gama · Envíos a domicilio</footer>
</main>
<script>
const phone='5493412141327';
const products=[
{id:1,name:'Yerba Mate',price:3500,cat:'Almacén',desc:'Yerba mate tradicional',emoji:'🧉'},
{id:2,name:'Gaseosa 2L',price:2800,cat:'Bebidas',desc:'Gaseosa familiar',emoji:'🥤'},
{id:3,name:'Galletitas',price:1500,cat:'Almacén',desc:'Galletitas surtidas',emoji:'🍪'},
{id:4,name:'Detergente',price:1900,cat:'Limpieza',desc:'Detergente para vajilla',emoji:'🧴'}
];
let cart={};let category='Todos';
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
function renderCats(){let cats=['Todos',...new Set(products.map(p=>p.cat))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===category?'active':''}" onclick="category='${c}';renderCats();render()">${c}</button>`).join('')}
function render(){let q=document.getElementById('search').value.toLowerCase();let list=products.filter(p=>(category==='Todos'||p.cat===category)&&(`${p.name} ${p.desc}`.toLowerCase().includes(q)));let el=document.getElementById('products');el.innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo">${p.emoji}</div><div class="info"><h3>${p.name}</h3><div class="desc">${p.desc}</div><div class="price">${money(p.price)}</div><button class="add" onclick="add(${p.id})">Agregar al carrito</button></div></article>`).join(''):'<div class="empty">No encontramos productos.</div>';updateCart()}
function add(id){cart[id]=(cart[id]||0)+1;updateCart()}
function updateCart(){let ids=Object.keys(cart);let count=ids.reduce((s,id)=>s+cart[id],0);let total=ids.reduce((s,id)=>{let p=products.find(x=>x.id==id);return s+p.price*cart[id]},0);document.getElementById('cart').hidden=count===0;document.getElementById('count').textContent=count;document.getElementById('total').textContent=money(total)}
function sendWhatsApp(){let ids=Object.keys(cart);if(!ids.length)return;let total=0;let lines=['Hola, quiero hacer este pedido desde De Primera Gama:',''];ids.forEach(id=>{let p=products.find(x=>x.id==id);let sub=p.price*cart[id];total+=sub;lines.push(`${cart[id]} x ${p.name} — ${money(sub)}`)});lines.push('',`Total: ${money(total)}`);lines.push('','¿Me confirman disponibilidad y envío a domicilio?');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(lines.join('\n')),'_blank')}
document.getElementById('search').addEventListener('input',render);renderCats();render();
</script>
</body>
</html>
